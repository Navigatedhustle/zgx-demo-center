# =============================================================================
# Medical AI Drug Interaction Demo - Docker Compose
#
# Inference via Ollama on host (GPU) — container is a thin FastAPI frontend.
# Uses host network so container can reach Ollama at localhost:11434.
#
# Usage:
#   ./start.sh --build             # First time / after code changes
#   ./start.sh                     # Subsequent runs
#   docker compose down            # Stop everything
#
# Prerequisites:
#   - Ollama running on host with medical-mixtral model
# =============================================================================

services:
  healthcare-demo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthcare-drug-interaction-demo
    network_mode: host
    volumes:
      - ./backend:/app/backend:ro
      - ./ddi_chromadb:/app/ddi_chromadb
    environment:
      - OLLAMA_BASE_URL=http://localhost:11434
      - OLLAMA_MODEL=medical-mixtral
      # Host IP for clickable URLs — auto-detected by start.sh
      - HOST_IP=${HOST_IP:-}
    restart: on-failure
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
